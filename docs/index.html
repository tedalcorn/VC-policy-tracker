<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vital City Coverage Tracker</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root {
  --bg: #fafaf7;
  --panel: #ffffff;
  --ink: #1a1a1a;
  --muted: #6a6a6a;
  --line: #e5e3dd;
  --accent: #b9381f;
  --accent-soft: #f4dfd7;
  --pill: #efece4;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a.title-link { color: var(--ink); }
a.title-link:hover { color: var(--accent); text-decoration: underline; }

header {
  padding: 16px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: baseline;
  gap: 24px;
  flex-wrap: wrap;
}
header h1 { font-size: 20px; margin: 0; font-weight: 700; }
header .stat { color: var(--ink); font-size: 13px; }

nav.tabs {
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding: 0 24px;
  display: flex;
  gap: 4px;
}
nav.tabs button {
  background: none;
  border: none;
  padding: 12px 16px;
  font: inherit;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs button:hover:not(.active) { color: var(--ink); }

main { padding: 16px 24px; max-width: 1500px; }
section.tab { display: none; }
section.tab.active { display: block; }

.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.filters input, .filters select {
  font: inherit; padding: 6px 10px; border: 1px solid var(--line);
  background: var(--panel); border-radius: 4px;
}
.filters input.search { width: 280px; }
.filters .count { color: var(--muted); font-size: 13px; margin-left: auto; }

table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 6px; overflow: hidden; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
table td:first-child, table th:first-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
th { background: #f3f1ea; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; user-select: none; }
th:hover { color: var(--ink); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #fbf9f3; }

.pill { display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--pill); font-size: 12px; color: var(--muted); margin-right: 4px; white-space: nowrap; }
.pill.bucket-rikers { background: #f1d0c6; color: #5e1e10; }
.pill.bucket-courts { background: #f5d6c8; color: #7e2a18; }
.pill.bucket-policing { background: #f8dccc; color: #a13c25; }
.pill.bucket-crisis { background: #fbe1d0; color: #b04826; }
.pill.bucket-cvi { background: #f0dac8; color: #8a4a26; }
.pill.bucket-guns { background: #f0d2c8; color: #6e2316; }
.pill.bucket-drugs { background: #f0cdc0; color: #722319; }
.pill.bucket-crimedata { background: #fadbcd; color: #9c4d35; }
.pill.bucket-ps-strategy { background: #fce1d3; color: #b85939; }
.pill.bucket-crime { background: #fae0d8; color: #8a3320; }
.pill.bucket-disorder { background: #fae0d4; color: #94432d; }
.pill.bucket-cars { background: #ffe6d8; color: #c46442; }
.pill.bucket-shoplifting { background: #f4dcc8; color: #8a5232; }
.pill.bucket-domestic { background: #f0d4d8; color: #7a2e3a; }
.pill.bucket-mental { background: #ddd6ec; color: #5a4a78; }
.pill.bucket-nonprofits { background: #d6dde6; color: #4a6480; }
.pill.bucket-fedpolicy { background: #e0d6ea; color: #3b2c4f; }
.pill.bucket-research { background: #ece7d8; color: #5c5034; }
.pill.bucket-technology { background: #e6ecda; color: #5e6e44; }
.pill.bucket-pubspace { background: #efe6cf; color: #8c7034; }
.pill.bucket-subway { background: #d6e5d2; color: #2f6b2f; }
.pill.bucket-buses { background: #e2eed4; color: #6a8c4a; }
.pill.bucket-homelessness { background: #d6dde4; color: #3d6072; }
.pill.bucket-governance { background: #e2eaf5; color: #2c4870; }
.pill.bucket-politics { background: #ecdef0; color: #5d2e6b; }
.pill.bucket-housing { background: #fde8c4; color: #8c5a13; }
.pill.bucket-transportation { background: #d8eed8; color: #2f6b2f; }
.pill.bucket-culture { background: #f0e0e8; color: #6b3057; }
.pill.bucket-data { background: #dfe5d9; color: #4a5c3b; }
.pill.bucket-series { background: #e5e3dd; color: #555; }
.pill.bucket-health { background: #d8eaef; color: #2a5e6a; }
.pill.bucket-education { background: #f0e7c4; color: #6e5310; }
.pill.bucket-economy { background: #e8e0f0; color: #4c3a6e; }
.pill.bucket-immigration { background: #e0eef0; color: #2c5e6a; }
.pill.bucket-race { background: #f0d9d9; color: #6e2e2e; }
.pill.bucket-climate { background: #d3ebcf; color: #2b6a2c; }
.pill.bucket-other { background: #e5e3dd; color: #777; }
.pill.status-adopted { background: #ccebcc; color: #1e5a1e; }
.pill.status-proposed { background: #ffe2b8; color: #7c5215; }
.pill.status-rejected { background: #e8d4d4; color: #6e3232; }
.pill.status-discussed { background: #d9e6f0; color: #2c4870; }
.pill.status-none { background: var(--pill); color: var(--muted); }
.pill.status-unreviewed { background: #f4dfd7; color: #8a3320; }
.pill.policy-yes { background: var(--accent-soft); color: var(--accent); }
.score { display: inline-block; min-width: 22px; text-align: center; padding: 2px 4px; border-radius: 4px; font-weight: 600; font-size: 12px; cursor: help; font-variant-numeric: tabular-nums; }
.score-0 { background: #eee; color: #888; }
.score-1 { background: #f0e6e0; color: #7a5a3f; }
.score-2 { background: #f5d8c8; color: #75412a; }
.score-3 { background: #f0bda5; color: #6f2913; }
.score-4 { background: #db7d5f; color: #fff; }
.score-5 { background: var(--accent); color: #fff; }
.score-empty { color: #ccc; font-size: 12px; }

/* Confidence shading — policy tracker only. */
#pol-table tr.confidence-5 td, #pol-table tr.confidence-5 td a.title-link { color: var(--ink); }
#pol-table tr.confidence-4 td, #pol-table tr.confidence-4 td a.title-link { color: #4a4a4a; }
#pol-table tr.confidence-3 td, #pol-table tr.confidence-3 td a.title-link { color: #888; }
#pol-table tr.confidence-2 td, #pol-table tr.confidence-2 td a.title-link { color: #b8b8b8; }
#pol-table tr.confidence-1 td, #pol-table tr.confidence-1 td a.title-link { color: #d0d0d0; }
#pol-table tr.confidence-0 td, #pol-table tr.confidence-0 td a.title-link { color: #e0e0e0; }

/* Policy tracker column widths — Recommendation gets the most space. */
#pol-table { table-layout: fixed; }
#pol-table th:nth-child(1), #pol-table td:nth-child(1) { width: 65px; }   /* date */
#pol-table th:nth-child(2), #pol-table td:nth-child(2) { width: 110px; }  /* domain */
#pol-table th:nth-child(3), #pol-table td:nth-child(3) { width: 170px; }  /* title */
#pol-table th:nth-child(4), #pol-table td:nth-child(4) { width: 105px; }  /* author */
#pol-table th:nth-child(5), #pol-table td:nth-child(5) { width: auto; }   /* rec — flexes */
#pol-table th:nth-child(6), #pol-table td:nth-child(6) { width: 140px; }  /* agencies */
#pol-table th:nth-child(7), #pol-table td:nth-child(7) { width: 60px; text-align: center; white-space: normal; }   /* Confidence score */
#pol-table th:nth-child(8), #pol-table td:nth-child(8) { width: 96px; }   /* status */
#pol-table td { word-wrap: break-word; overflow-wrap: anywhere; }
#pol-table td.rec-cell { white-space: normal; }
/* Let the domain pill wrap inside its column instead of overflowing into Title
   (long labels like "Public safety strategy"). */
#pol-table td:nth-child(2) .pill { white-space: normal; max-width: 100%; }
/* Override .pill's nowrap so multi-agency cells stack vertically inside their column */
#pol-table td:nth-child(6) .pill { white-space: normal; display: inline-block; margin-bottom: 2px; max-width: 100%; }
/* Institutional-author marker in the Author column. */
.vc-badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
  padding: 0 4px; border-radius: 6px; background: #2c4870; color: #fff; vertical-align: middle; }
#pol-table th.active, #art-table th.active { color: var(--ink); }
#pol-table th.active::after, #art-table th.active::after { content: " ↓"; }
#pol-table th.active.asc::after, #art-table th.active.asc::after { content: " ↑"; }

#detail-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  display: none; align-items: flex-start; justify-content: center;
  padding: 40px 20px; z-index: 100; overflow: auto;
}
#detail-overlay.open { display: flex; }
#detail-panel {
  background: var(--panel); border-radius: 8px;
  max-width: 720px; width: 100%; padding: 24px; position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
#detail-panel .close {
  position: absolute; top: 12px; right: 16px;
  background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted);
}
#detail-panel h2 { margin: 0 0 8px; font-size: 22px; }
#detail-panel .meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
#detail-panel .meta.wrap { white-space: normal; overflow-wrap: anywhere; }
#detail-panel .meta.meta-split { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
#detail-panel .meta.meta-split .meta-domains { text-align: right; }
#detail-panel .section.inferred { position: relative; padding-right: 40px; }
#detail-panel .section h3 em { font-style: italic; text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 14px; }
#detail-panel .section { margin: 16px 0; padding-top: 12px; border-top: 1px solid var(--line); }
#detail-panel .section h3 { font-size: 13px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; letter-spacing: 0.05em; }
#detail-panel .empty { color: var(--muted); font-style: italic; font-size: 13px; }
#detail-panel .excerpt { font-size: 14px; line-height: 1.5; }
#detail-panel dl { margin: 0; }
#detail-panel dl dt { color: var(--muted); font-size: 12px; margin-top: 8px; }
#detail-panel dl dd { margin: 2px 0 0 0; font-size: 14px; }
#detail-panel .edit-hint {
  margin-top: 16px; padding: 12px; background: #fbf6ea; border-radius: 4px;
  font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace;
}

#chart { height: 1100px; background: var(--panel); border-radius: 6px; padding: 8px; }
.chart-controls { margin-bottom: 12px; }
.chart-controls label { margin-right: 16px; font-size: 13px; }

.author-grid { background: var(--panel); border-radius: 6px; overflow: hidden; }
.author-header {
  display: grid;
  grid-template-columns: minmax(180px, 240px) 70px 1fr;
  gap: 16px;
  padding: 8px 14px;
  background: #f3f1ea;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  font-weight: 600;
  border-bottom: 1px solid var(--line);
}
.author-header .sort-h { cursor: pointer; user-select: none; }
.author-header .sort-h:hover { color: var(--ink); }
.author-header .sort-h.active { color: var(--ink); }
.author-header .sort-h.active::after { content: " ↓"; }
.author-header .sort-h.active.asc::after { content: " ↑"; }
.author-card {
  display: grid;
  grid-template-columns: minmax(180px, 240px) 70px 1fr;
  gap: 16px;
  align-items: start;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.author-card:last-child { border-bottom: none; }
.author-card:hover { background: #fbf9f3; }
.author-card .name { font-weight: 600; font-size: 14px; line-height: 1.25; }
.author-card .meta { color: var(--muted); font-size: 11px; line-height: 1.3; margin-top: 2px; }
.author-card .count { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink); padding-top: 1px; }
.author-card .count .lbl { color: var(--muted); font-size: 11px; }
.author-card > * { min-width: 0; }
.author-card .dist { min-width: 0; }
.author-card .dist .blocks { display: flex; flex-wrap: wrap; gap: 1px; align-items: center; margin-bottom: 4px; }
.author-card .dist .blocks .blk { width: 8px; height: 14px; border-radius: 1px; }
.author-card .dist .legend { font-size: 11px; line-height: 1.45; max-width: 100%; word-wrap: break-word; }
.author-card .dist .legend span.entry { margin-right: 12px; white-space: nowrap; display: inline-block; }
.author-card .dist .legend .num { color: var(--muted); margin-left: 2px; font-variant-numeric: tabular-nums; }

.topic-color-rikers { color: #5e1e10; }

.inline-toggle {
  display: inline-flex;
  align-items: center;
  font: inherit;
  padding: 6px 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 4px;
  cursor: pointer;
  color: var(--ink);
}
.inline-toggle input { margin-right: 6px; }
/* Popup's continuation toggle (inside the detail panel) uses the smaller form */
#detail-panel .inline-toggle { font-size: 12px; padding: 4px 8px; color: var(--muted); }
.author-articles { margin-top: 4px; max-height: 60vh; overflow-y: auto; }
.author-articles .item { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; align-items: baseline; }
.author-articles .item:last-child { border-bottom: none; }
.author-articles .date { color: var(--muted); font-size: 11px; flex: 0 0 60px; font-variant-numeric: tabular-nums; }
.author-articles .type-slot { flex: 0 0 90px; text-align: left; }
.author-articles .title { flex: 1; min-width: 0; }
.author-articles .tags { flex: 0 0 auto; text-align: right; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px; max-width: 45%; }
.pill.type-pill { background: #2c4870; color: #fff; font-weight: 500; }

.empty-state { padding: 32px; background: var(--panel); border-radius: 6px; color: var(--muted); text-align: center; }
.policy-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }

<body>

<header>
  <h1>Vital City Coverage Tracker</h1>
  <div class="stat"><span id="hdr-count">—</span> pages (<span id="hdr-range">—</span>)</div>
  <div class="stat"><span id="hdr-authors">—</span> distinct authors</div>
  <div class="stat"><span id="hdr-tracked">—</span> inferred policy recommendations</div>
</header>

<nav class="tabs">
  <button data-tab="articles" class="active">Pages</button>
  <button data-tab="topics">Years</button>
  <button data-tab="authors">Authors</button>
  <button data-tab="policy">Policy tracker</button>
</nav>

<main>

<section class="tab active" id="tab-articles">
  <div class="filters">
    <input type="text" class="search" id="art-search" placeholder="Search title, author, excerpt…">
    <select id="art-year"><option value="">All years</option></select>
    <select id="art-bucket"><option value="">All domains</option></select>
    <select id="art-author"><option value="">All authors</option></select>
    <select id="art-type"><option value="">All page types</option></select>
    <span class="count" id="art-count"></span>
  </div>
  <table id="art-table">
    <thead><tr>
      <th data-sort="published_at">Date</th>
      <th data-sort="title">Title</th>
      <th data-sort="primary_author_last">Author</th>
      <th data-sort="article_type">Type</th>
      <th data-sort="bucket">Domains</th>
      <th data-sort="word_count">Words</th>
      <th data-sort="score">Conf. score</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</section>

<section class="tab" id="tab-topics">
  <div class="chart-controls">
    <label><input type="radio" name="chart-mode" value="counts" checked> Article counts</label>
    <label><input type="radio" name="chart-mode" value="share"> Share of year (%)</label>
    <label class="inline-toggle" style="margin-left:16px;"><input type="checkbox" id="chart-articles-only" checked> Articles only</label>
  </div>
  <div id="chart"></div>
</section>

<section class="tab" id="tab-authors">
  <div class="filters">
    <input type="text" class="search" id="aut-search" placeholder="Search author or institution…">
    <select id="aut-profession"><option value="">All professions</option></select>
    <select id="aut-domain"><option value="">All domains</option></select>
    <label class="inline-toggle"><input type="checkbox" id="aut-articles-only" checked> Articles only</label>
    <span class="count" id="aut-count"></span>
  </div>
  <div class="author-grid">
    <div class="author-header">
      <div data-sort="last_name" class="sort-h">Author</div>
      <div data-sort="count" class="sort-h">Bylines</div>
      <div>Domain distribution</div>
    </div>
    <div id="aut-grid"></div>
  </div>
</section>

<section class="tab" id="tab-policy">
  <div class="policy-controls">
    <select id="pol-affiliation">
      <option value="">All authors</option>
      <option value="team">VC team</option>
      <option value="contributors">Outside contributors</option>
    </select>
    <select id="pol-domain"><option value="">All domains</option></select>
    <select id="pol-agency"><option value="">All agencies</option></select>
    <select id="pol-status"><option value="">All action statuses</option></select>
    <select id="pol-lever"><option value="">All levers</option></select>

<script>
const BUCKET_CLASS = {
  "Rikers & jails": "rikers",
  "Criminal courts": "courts",
  "Policing": "policing",
  "Crisis response": "crisis",
  "Community violence intervention": "cvi",
  "Guns": "guns",
  "Drugs": "drugs",
  "Crime data": "crimedata",
  "Public safety strategy": "ps-strategy",
  "Crime": "crime",
  "Disorder": "disorder",
  "Cars": "cars",
  "Shoplifting": "shoplifting",
  "Domestic violence": "domestic",
  "Mental illness": "mental",
  "Governance": "governance",
  "Nonprofits": "nonprofits",
  "Federal policy": "fedpolicy",
  "Research": "research",
  "Technology": "technology",
  "Public space": "pubspace",
  "Politics": "politics",
  "Housing": "housing",
  "Subway": "subway",
  "Buses": "buses",
  "Transit": "transportation",
  "Homelessness": "homelessness",
  "Culture": "culture",
  "Data": "data",
  "Health & human services": "health",
  "Youth": "education",
  "Economy": "economy",
  "Immigration": "immigration",
  "Race": "race",
  "Climate": "climate",
  "Other": "other",
};
// META-CATEGORIES — major groupings for the Years chart. Each domain gets a
// shade of its meta-cat's base color so the bigger trends are apparent.
const META_CATEGORIES = [
  { name: "Public safety",      base: "#8a3320", members: ["Rikers & jails","Criminal courts","Policing","Crisis response","Community violence intervention","Guns","Drugs","Crime data","Public safety strategy","Disorder","Mental illness","Shoplifting","Domestic violence","Crime"] },
  { name: "Governance & civic", base: "#2c4870", members: ["Governance","Politics","Nonprofits","Research","Federal policy"] },
  { name: "Housing & space",    base: "#8c5a13", members: ["Housing","Public space","Homelessness"] },
  { name: "Transit",            base: "#2f6b2f", members: ["Subway","Buses","Cars"] },
  { name: "Society",            base: "#2a5e6a", members: ["Race","Immigration","Youth","Culture","Climate"] },
  { name: "Economy & tech",     base: "#4c3a6e", members: ["Economy","Technology"] },
  { name: "Other",              base: "#888888", members: ["Other"] },
];

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max === min) { h = s = 0; }
  else {
    const d = max - min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch (max) {
      case r: h = (g-b)/d + (g<b?6:0); break;
      case g: h = (b-r)/d + 2; break;
      case b: h = (r-g)/d + 4; break;
    }
    h /= 6;
  }
  return { h: h*360, s: s*100, l: l*100 };
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, 9-k(n), 1));
  const c = x => Math.round(255*x).toString(16).padStart(2,"0");
  return "#" + c(f(0)) + c(f(8)) + c(f(4));
}
function metaShade(baseHex, idx, total) {
  if (total <= 1) return baseHex;
  const hsl = hexToHsl(baseHex);
  const minL = Math.max(15, hsl.l - 8);
  const maxL = Math.min(72, hsl.l + 28);
  const newL = minL + (maxL - minL) * (idx / (total - 1));
  return hslToHex(hsl.h, Math.min(80, hsl.s + 6), newL);
}

// Domain → meta-cat name; domain → shaded color; ordered domain list.
const BUCKET_META = {};
const BUCKET_COLOR = {};
const BUCKET_ORDER = [];
META_CATEGORIES.forEach(mc => {
  mc.members.forEach((d, idx) => {
    BUCKET_META[d] = mc.name;
    BUCKET_COLOR[d] = metaShade(mc.base, idx, mc.members.length);
    BUCKET_ORDER.push(d);
  });
});

let ARTICLES = [], POLICY = {}, AUTHORS = [], SUMMARY = {}, SCORES = {}, INSTITUTIONAL = {};
let SORT_KEY = "published_at", SORT_DIR = -1;

function bucketPill(b) {
  return `<span class="pill bucket-${BUCKET_CLASS[b] || "other"}">${b.replace(" / ", "/")}</span>`;
}

function fmtDate(s) {
  // "2026-04-08" or "2026-04-08T20:23:54" -> "4/8/26"
  if (!s) return "";
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return s;
  return `${+m[2]}/${+m[3]}/${m[1].slice(2)}`;
}

const SURNAME_PARTICLES = new Set(["de","del","della","der","den","di","da","du","van","von","vom","zu","le","la","ten","ter","bin","ibn","al","el"]);
function lastNameKey(name) {
  if (!name) return "zzzz";
  if (name === "No byline") return "zzzz";
  const parts = name.replace(",", " ").trim().split(/\s+/);
  if (parts.length === 0) return name.toLowerCase();
  if (parts.length >= 3 && SURNAME_PARTICLES.has(parts[parts.length-2].toLowerCase())) {
    return (parts[parts.length-2] + " " + parts[parts.length-1]).toLowerCase();
  }
  return parts[parts.length-1].toLowerCase();
}

async function loadData() {
  const [arts, pol, auts, sum, scores] = await Promise.all([
    fetch("data/articles.json").then(r => r.json()),
    fetch("data/policy_tracking.json").then(r => r.json()),
    fetch("data/authors.json").then(r => r.json()),
    fetch("data/build_summary.json").then(r => r.json()),
    fetch("data/policy_scores.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
  ]);
  ARTICLES = arts;
  POLICY = pol;
  AUTHORS = auts;
  SUMMARY = sum;
  SCORES = scores;
  // author name -> "core" | "affiliated" | "" (outside contributor).
  // Drives the Policy tracker's VC team / contributor filter and badges.
  INSTITUTIONAL = Object.fromEntries(
    AUTHORS.filter(a => a.institutional).map(a => [a.author, a.institutional])
  );
  renderHeader();
  populateFilters();
  renderArticles();
  renderAuthors();
  renderPolicy();
  renderChart();
  applyHashToUI();
  // After hash applied, re-render with restored filters
  renderArticles();
  renderAuthors();
  renderPolicy();
  renderChart();
}

function renderHeader() {
  document.getElementById("hdr-count").textContent = ARTICLES.length.toLocaleString();
  const r = SUMMARY.date_range;
  if (r) document.getElementById("hdr-range").textContent = fmtDate(r[0]) + " – " + fmtDate(r[1]);
  document.getElementById("hdr-authors").textContent = AUTHORS.length || new Set(ARTICLES.map(a => a.primary_author)).size;
  const tracked = Object.values(POLICY).filter(p =>
    p.has_policy_rec && p.has_policy_rec !== "unreviewed" && p.has_policy_rec !== "no"
  ).length;
  document.getElementById("hdr-tracked").textContent = tracked;
}

function populateFilters() {
  const years = Array.from(new Set(ARTICLES.map(a => a.year).filter(Boolean))).sort((a,b)=>b-a);
  fillSelect("art-year", years);
  // Dropdowns sorted A→Z for easy scanning; the chart still uses BUCKET_ORDER
  // for visual clustering (Public Safety reds first, etc.)
  const SORTED = [...BUCKET_ORDER].sort();
  fillSelect("art-bucket", SORTED);
  fillSelect("aut-domain", SORTED);
  const authors = Array.from(new Set(ARTICLES.map(a => a.primary_author).filter(Boolean)))
    .sort((a, b) => lastNameKey(a).localeCompare(lastNameKey(b)));
  fillSelect("art-author", authors);
  const types = Array.from(new Set(ARTICLES.map(a => a.article_type).filter(Boolean))).sort();
  // Pretty label for the dropdown (caps first word, spaces); keep raw value for filtering.
  // "article" goes first and renders in bold since most pieces are articles.
  const prettyType = t => {
    const s = t.replace(/_/g, " ");
    return s.charAt(0).toUpperCase() + s.slice(1);
  };
  const orderedTypes = ["article", ...types.filter(t => t !== "article")];
  fillSelectMapped("art-type", orderedTypes, prettyType, t => t === "article");
  // Policy-tracker agencies come from POLICY rows (what's actually being asked of),
  // not body-scan mentions. Tracker domain dropdown alphabetized like the article one.
  fillSelect("pol-domain", SORTED);
  const trackedAgencies = new Set();
  Object.values(POLICY).forEach(p => {
    const v = p.has_policy_rec;
    if (v === "yes" || v === "partial" || v === "interview-only") {
      (p.agencies || "").split(/;\s*/).filter(Boolean).forEach(a => trackedAgencies.add(a));
    }
  });
  fillSelect("pol-agency", Array.from(trackedAgencies).sort());
  const statuses = ["none","discussed","proposed","adopted","rejected","abandoned"];
  fillSelect("pol-status", statuses);
  fillSelect("pol-lever", ["legislation","regulation","budget","executive","internal","culture"]);
  const profs = Array.from(new Set(AUTHORS.map(a => a.current_profession).filter(Boolean))).sort();
  fillSelect("aut-profession", profs);
}

function fillSelect(id, opts) {
  const sel = document.getElementById(id);
  if (!sel) return;
  opts.forEach(o => {
    const el = document.createElement("option");
    el.value = o; el.textContent = o; sel.appendChild(el);
  });
}
function fillSelectMapped(id, opts, labelFn, boldFn) {
  const sel = document.getElementById(id);
  if (!sel) return;
  opts.forEach(o => {
    const el = document.createElement("option");
    el.value = o; el.textContent = labelFn(o);
    if (boldFn && boldFn(o)) el.style.fontWeight = "bold";
    sel.appendChild(el);
  });
}

// ============ Articles tab ============
function articleFilter() {
  const q = document.getElementById("art-search").value.toLowerCase();
  const year = document.getElementById("art-year").value;
  const bucket = document.getElementById("art-bucket").value;
  const author = document.getElementById("art-author").value;
  const type = document.getElementById("art-type").value;
  return ARTICLES.filter(a => {
    if (year && String(a.year) !== year) return false;
    if (bucket && !(a.buckets || []).includes(bucket)) return false;
    if (author && a.primary_author !== author) return false;
    if (type && a.article_type !== type) return false;
    if (q) {
      const blob = (a.title + " " + a.primary_author + " " + (a.authors||[]).join(" ") + " " + (a.excerpt||"")).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function renderArticles() {
  let rows = articleFilter();
  rows.sort((a, b) => {
    let av, bv;
    if (SORT_KEY === "bucket") {
      // Sort by NUMBER of domains (most to least by default) so heavily
      // multi-tagged pieces surface for review and pare-down.
      av = (a.buckets || []).length;
      bv = (b.buckets || []).length;
    }
    else if (SORT_KEY === "score") {
      av = Number((SCORES[a.slug] || {}).score || -1);
      bv = Number((SCORES[b.slug] || {}).score || -1);
    }
    else { av = a[SORT_KEY] || ""; bv = b[SORT_KEY] || ""; }
    return (av < bv ? -1 : av > bv ? 1 : 0) * SORT_DIR;
  });
  document.getElementById("art-count").textContent = rows.length + " of " + ARTICLES.length;
  const tbody = document.querySelector("#art-table tbody");
  tbody.innerHTML = rows.slice(0, 500).map(a => {
    const buckets = (a.buckets||[]).map(bucketPill).join("");
    const typePill = a.article_type && a.article_type !== "article"
      ? `<span class="pill">${a.article_type.replace(/_/g," ")}</span>` : "";
    const sc = SCORES[a.slug];
    const scoreCell = sc
      ? `<span class="score score-${sc.score}" title="${escapeHtml(sc.rationale || '')}">${sc.score}</span>`
      : `<span class="score-empty">—</span>`;
    return `<tr data-slug="${a.slug}">
      <td>${fmtDate(a.published_at)}</td>
      <td><a class="title-link" href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a></td>
      <td>${escapeHtml(a.primary_author||"")}</td>
      <td>${typePill}</td>
      <td>${buckets}</td>
      <td>${(a.word_count || 0).toLocaleString()}</td>
      <td>${scoreCell}</td>
    </tr>`;
  }).join("");
  if (rows.length > 500) {
    tbody.innerHTML += `<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:16px;">Showing first 500. Refine filters to see more.</td></tr>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

// ============ Chart ============
function computeBucketByYear(articlesOnly) {
  // Fractional: an article tagged with N domains contributes 1/N to each.
  // Keeps the total per year honest (1 article = 1 unit, never duplicated).
  const out = {};
  const yearSet = new Set();
  ARTICLES.forEach(a => {
    if (!a.year) return;
    if (articlesOnly && a.article_type !== "article") return;
    const buckets = a.buckets || [];
    if (!buckets.length) return;
    yearSet.add(a.year);
    const weight = 1 / buckets.length;
    buckets.forEach(b => {
      if (!out[b]) out[b] = {};
      out[b][a.year] = (out[b][a.year] || 0) + weight;
    });
  });
  return { byYear: out, years: Array.from(yearSet).sort() };
}

function renderChart() {
  const mode = document.querySelector("input[name='chart-mode']:checked").value;
  const articlesOnly = document.getElementById("chart-articles-only").checked;
  const { byYear, years } = computeBucketByYear(articlesOnly);
  let yearTotals = {};
  if (mode === "share") {
    years.forEach(y => yearTotals[y] = BUCKET_ORDER.reduce((s,b)=>s+((byYear[b]||{})[y]||0),0));
  }
  // Track which meta-cat we've already labeled so only the FIRST trace in each
  // group gets the legendgrouptitle (Plotly's pattern for nested legends).
  const labeled = new Set();
  const fmt = mode === "share" ? "%{y:.1f}%" : "%{y:.1f}";
  const traces = BUCKET_ORDER.map(b => {
    const meta = BUCKET_META[b] || "Other";
    const rawTotal = years.reduce((s,y) => s + ((byYear[b]||{})[y] || 0), 0);
    if (rawTotal < 0.5) return null;        // skip empty buckets entirely
    const yearVals = years.map(y => {
      const c = (byYear[b]||{})[y] || 0;
      return mode === "share" ? (yearTotals[y] ? c*100/yearTotals[y] : 0) : c;
    });
    const total = Math.round(rawTotal);
    const trace = {
      x: years,
      y: yearVals,
      name: `  ${b} (${total})`,    // sub-domain w/ count, indented to read nested
      type: "bar",
      legendgroup: meta,
      marker: { color: BUCKET_COLOR[b] || "#aaa" },
      hovertemplate: `<b>${b}</b><br>%{x}: ${fmt}<extra></extra>`,
    };
    if (!labeled.has(meta)) {
      trace.legendgrouptitle = { text: "<b>" + meta + "</b>" };
      labeled.add(meta);
    }
    return trace;
  }).filter(t => t);
  Plotly.newPlot("chart", traces, {
    barmode: "stack",
    margin: { l: 60, r: 20, t: 20, b: 40 },
    paper_bgcolor: "#fafaf7", plot_bgcolor: "#fafaf7",
    yaxis: { title: mode === "share" ? "% of articles" : "Articles" },
    legend: { orientation: "v" },
    font: { family: "system-ui", size: 12 },
  }, { responsive: true });
}

// ============ Authors tab ============
let AUTHOR_ARTICLES = {};      // computed once on first render
let AUTHOR_META = {};
function buildAuthorIndex() {
  AUTHOR_ARTICLES = {};
  ARTICLES.forEach(a => {
    const names = (a.authors && a.authors.length) ? a.authors : [a.primary_author];
    names.forEach(n => {
      if (!n) return;
      if (!AUTHOR_ARTICLES[n]) AUTHOR_ARTICLES[n] = [];
      AUTHOR_ARTICLES[n].push(a);
    });
  });
  AUTHOR_META = Object.fromEntries(AUTHORS.map(a => [a.author, a]));
}

let AUTHOR_SORT = { key: "count", dir: -1 };  // default: most bylines first
function renderAuthors() {
  if (!Object.keys(AUTHOR_ARTICLES).length) buildAuthorIndex();
  const q = document.getElementById("aut-search").value.toLowerCase();
  const prof = document.getElementById("aut-profession").value;
  const articlesOnly = document.getElementById("aut-articles-only").checked;
  const domainFilter = document.getElementById("aut-domain").value;

  // Apply both filters to each author's article set. Authors with zero
  // remaining pieces drop off the list entirely.
  const effective = {};
  Object.keys(AUTHOR_ARTICLES).forEach(name => {
    let arts = AUTHOR_ARTICLES[name];
    if (articlesOnly) arts = arts.filter(a => a.article_type === "article");
    if (domainFilter) arts = arts.filter(a => (a.buckets || []).includes(domainFilter));
    if (arts.length) effective[name] = arts;
  });

  const names = Object.keys(effective);
  const filtered = names.filter(n => {
    const meta = AUTHOR_META[n] || {};
    if (prof && meta.current_profession !== prof) return false;
    if (q && !(n + " " + (meta.current_employer||"") + " " + (meta.current_profession||"")).toLowerCase().includes(q)) return false;
    return true;
  });
  filtered.sort((a, b) => {
    if (AUTHOR_SORT.key === "count") {
      return (effective[a].length - effective[b].length) * AUTHOR_SORT.dir;
    }
    return lastNameKey(a).localeCompare(lastNameKey(b)) * AUTHOR_SORT.dir;
  });

  document.getElementById("aut-count").textContent = filtered.length + " of " + names.length;
  document.getElementById("aut-grid").innerHTML = filtered.map(n => renderAuthorCard(n, effective[n])).join("");
  document.querySelectorAll(".author-header .sort-h").forEach(el => {
    el.classList.toggle("active", el.dataset.sort === AUTHOR_SORT.key);
    el.classList.toggle("asc", AUTHOR_SORT.dir === 1);
  });
}

function primaryBucket(a) {
  return (a.buckets && a.buckets[0]) || "Other / unclassified";
}

function renderAuthorCard(name, artsOverride) {
  const meta = AUTHOR_META[name] || {};
  const arts = artsOverride || AUTHOR_ARTICLES[name];
  // One square per byline. Color = primary bucket (= buckets[0], which derives
  // from Ghost's primary tag). No double-counting.
  const counts = new Map();
  arts.forEach(a => {
    const b = primaryBucket(a);
    counts.set(b, (counts.get(b)||0)+1);
  });
  const ordered = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]);
  // Render blocks grouped by bucket, in descending order, so they read as a
  // proportional unit chart even at small sizes.
  const blocks = ordered.map(([b, c]) => {
    const cls = BUCKET_CLASS[b] || "other";
    return Array(c).fill(0).map(() => `<span class="blk topic-bg-${cls}"></span>`).join("");
  }).join("");
  const legend = ordered.map(([b, _c]) => {
    const cls = BUCKET_CLASS[b] || "other";
    return `<span class="entry topic-color-${cls}">${escapeHtml(b)}</span>`;
  }).join("");
  const metaParts = [];
  metaParts.push(meta.current_profession || (name === "No byline" ? "institutional" : "unclassified"));
  if (meta.current_employer) metaParts.push(meta.current_employer);
  return `<div class="author-card" data-author="${escapeHtml(name)}">
    <div>
      <div class="name">${escapeHtml(name)}</div>
      <div class="meta">${escapeHtml(metaParts.join(" · "))}</div>
    </div>
    <div class="count">${arts.length}<span class="lbl"> byline${arts.length===1?"":"s"}</span></div>
    <div class="dist">
      <div class="blocks">${blocks}</div>
      <div class="legend">${legend}</div>
    </div>
  </div>`;
}

let AUTHOR_DETAIL_FILTER = { name: null, articlesOnly: false };
function openAuthorDetail(name) {
  AUTHOR_DETAIL_FILTER = { name, articlesOnly: false };
  renderAuthorDetail();
  document.getElementById("detail-overlay").classList.add("open");
}
function renderAuthorDetail() {
  const name = AUTHOR_DETAIL_FILTER.name;
  if (!name) return;
  const arts = AUTHOR_ARTICLES[name] || [];
  const meta = AUTHOR_META[name] || {};
  const articlesOnly = AUTHOR_DETAIL_FILTER.articlesOnly;
  const visible = arts.filter(a => articlesOnly ? a.article_type === "article" : true);
  const items = visible.slice().sort((a, b) => (b.published_at || "").localeCompare(a.published_at || ""));
  const items_html = items.map(a => {
    const tags = (a.buckets || []).map(b =>
      `<span class="pill bucket-${BUCKET_CLASS[b] || "other"}">${escapeHtml(b)}</span>`
    ).join("");
    const typeTag = a.article_type && a.article_type !== "article"
      ? `<span class="pill type-pill">${a.article_type.replace(/_/g," ")}</span>` : "";
    return `<div class="item">
      <span class="date">${fmtDate(a.published_at)}</span>
      <span class="type-slot">${typeTag}</span>
      <span class="title"><a class="title-link" href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a></span>
      <span class="tags">${tags}</span>
    </div>`;
  }).join("");
  const metaLine = [
    meta.current_profession || (name === "No byline" ? "institutional" : "unclassified"),
    meta.current_employer || "",
  ].filter(Boolean).join(" · ");
  const nonArt = arts.length - arts.filter(a => a.article_type === "article").length;
  const toggle = nonArt > 0
    ? `<label class="inline-toggle"><input type="checkbox" id="auth-articles-only" ${articlesOnly?"checked":""}> Articles only</label>`
    : "";
  document.getElementById("detail-body").innerHTML = `
    <h2>${escapeHtml(name)}</h2>
    <div class="meta wrap">${escapeHtml(metaLine)}</div>
    <div class="section">
      <h3>Links (${visible.length}${visible.length !== arts.length ? ` of ${arts.length}` : ""})</h3>
      ${toggle}
      <div class="author-articles">${items_html || '<span class="empty">none in current filter</span>'}</div>
    </div>
  `;
  const cb = document.getElementById("auth-articles-only");
  if (cb) cb.onchange = () => {
    AUTHOR_DETAIL_FILTER.articlesOnly = cb.checked;
    renderAuthorDetail();
  };
}

// ============ Policy tracker tab ============
// Small marker next to Vital City team authors.
function authorBadge(author) {
  return INSTITUTIONAL[author]
    ? ` <span class="vc-badge" title="Vital City team">VC</span>`
    : "";
}
let POL_SORT = { key: "score", dir: -1 };  // default: highest confidence first
function renderPolicy() {
  const affiliation = document.getElementById("pol-affiliation").value;
  const domain = document.getElementById("pol-domain").value;
  const agency = document.getElementById("pol-agency").value;
  const status = document.getElementById("pol-status").value;
  const lever = document.getElementById("pol-lever").value;
  const articleBySlug = Object.fromEntries(ARTICLES.map(a => [a.slug, a]));
  const slugs = Object.keys(POLICY).filter(s => {
    const p = POLICY[s];
    const sc = SCORES[s] || {};
    const score = Number(sc.score || 0);
    // When "Inferred recommendation" is checked (default), only show pieces
    // the AI scored ≥3 — those are the ones with a real policy_ask. Uncheck
    // to also see 1s and 2s (no rec, but visible in the gradient).
    const inferredOnly = document.getElementById("pol-inferred-only").checked;
    const minScore = inferredOnly ? 3 : 1;
    if (score < minScore) return false;
    if (affiliation) {
      const tier = INSTITUTIONAL[p.primary_author] || "";
      if (affiliation === "team" && !tier) return false;
      if (affiliation === "contributors" && tier) return false;
    }
    if (domain) {
      const a = articleBySlug[s] || {};
      if (!(a.buckets || []).includes(domain)) return false;
    }
    if (agency && !(p.agencies||"").split(/;\s*/).includes(agency)) return false;
    if (status && p.action_status !== status) return false;
    if (lever && !(p.levers||"").split(/;\s*/).includes(lever)) return false;
    return true;
  });
  // Compute sort key for each slug
  const keyOf = (s) => {
    const p = POLICY[s];
    const a = articleBySlug[s] || {};
    const sc = SCORES[s] || {};
    switch (POL_SORT.key) {
      case "date":     return p.published_at || "";
      case "domain":   return (a.buckets || [])[0] || "zzz";
      case "title":    return (p.title || "").toLowerCase();
      case "author":   return (p.primary_author || "").toLowerCase();
      case "rec":      return (p.rec_summary || "").toLowerCase();
      case "agencies": return (p.agencies || "").toLowerCase();
      case "score":    return Number(sc.score || 0);
      case "status":   return p.action_status || "";
      default:         return "";
    }
  };
  slugs.sort((a, b) => {
    const ka = keyOf(a), kb = keyOf(b);
    if (ka < kb) return -1 * POL_SORT.dir;
    if (ka > kb) return  1 * POL_SORT.dir;
    return 0;
  });
  const tbody = document.querySelector("#pol-table tbody");
  if (!slugs.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty-state">No policy-tracked articles yet. Edit <code>policy_tracking.csv</code> to add some.</td></tr>`;
    return;
  }
  tbody.innerHTML = slugs.map(s => {
    const p = POLICY[s];
    const a = articleBySlug[s] || {};
    const sc = SCORES[s] || {};
    const score = Number(sc.score || 0);
    const sp = p.action_status || "none";
    const domain = (a.buckets || [])[0] || "";
    const domainPill = domain
      ? `<span class="pill bucket-${BUCKET_CLASS[domain] || "other"}">${escapeHtml(domain)}</span>`
      : "";
    const scoreCell = sc.score
      ? `<span class="score score-${sc.score}" title="${escapeHtml(sc.rationale || '')}">${sc.score}</span>`
      : `<span class="score-empty">—</span>`;
    return `<tr data-slug="${s}" class="confidence-${score || 0}">
      <td>${fmtDate(p.published_at)}</td>
      <td>${domainPill}</td>
      <td><a class="title-link" href="${a.url||p.url||"#"}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a></td>
      <td>${escapeHtml(p.primary_author||"")}${authorBadge(p.primary_author)}</td>
      <td class="rec-cell">${escapeHtml(p.rec_summary||"")}</td>
      <td>${(p.agencies||"").split(/;\s*/).filter(Boolean).map(x=>`<span class="pill">${escapeHtml(x)}</span>`).join("")}</td>
      <td>${scoreCell}</td>
      <td><span class="pill status-${sp}">${sp}</span></td>
    </tr>`;
  }).join("");
  // Active sort indicator on column header
  document.querySelectorAll("#pol-table th").forEach(th => {
    th.classList.toggle("active", th.dataset.sort === POL_SORT.key);
    th.classList.toggle("asc", POL_SORT.dir === 1);
  });
}

// ============ Detail overlay ============
function openDetail(slug) {
  const a = ARTICLES.find(x => x.slug === slug);
  const p = POLICY[slug] || {};
  if (!a) return;
  const buckets = (a.buckets||[]).map(bucketPill).join("");
  const agencies = (a.agencies||[]).map(ag =>
    `<span class="pill" title="${ag.hits} mention${ag.hits===1?"":"s"}">${escapeHtml(ag.name)} <span style="color:var(--muted);font-size:10px;">${ag.hits}</span></span>`
  ).join("");
  const authors = (a.authors||[]).map(escapeHtml).join(", ");
  const sc = SCORES[a.slug];
  const targetPills = ((p.agencies || sc?.target || "")
    .split(/;\s*/).filter(Boolean)
    .map(t => `<span class="pill">${escapeHtml(t)}</span>`)
    .join(" "));
  const inferred = sc && (sc.has_policy_rec === "yes" || sc.has_policy_rec === "partial")
    ? `<div class="section inferred">
         <span class="score score-${sc.score}" style="position:absolute; top:14px; right:0;">${sc.score}</span>
         <h3><em>Inferred recommendation</em></h3>
         <div>${escapeHtml(sc.policy_ask || "")}</div>
         <h3 style="margin-top:14px;"><em>Inferred target</em></h3>
         <div>${targetPills}</div>
       </div>`
    : "";
  // Show the supporting verbatim excerpt the AI pulled from the article body
  // when available; otherwise fall back to Ghost's excerpt.
  const excerptText = (sc && sc.supporting_excerpt) || a.excerpt || "";
  document.getElementById("detail-body").innerHTML = `
    <h2><a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a></h2>
    <div class="meta meta-split">
      <span>${fmtDate(a.published_at)} · ${authors} · ${(a.word_count||0).toLocaleString()} words</span>
      <span class="meta-domains">${buckets}</span>
    </div>
    <div class="section">
      <h3>Agencies detected in text</h3>${agencies || '<span class="empty">none</span>'}
    </div>
    <div class="section">
      <div class="excerpt">${excerptText ? '“' + escapeHtml(excerptText) + '”' : '<span class="empty">no excerpt</span>'}</div>
    </div>
    ${inferred}
  `;
  document.getElementById("detail-overlay").classList.add("open");
}
function closeDetail() { document.getElementById("detail-overlay").classList.remove("open"); }

// ============ Wire up ============
document.querySelectorAll("nav.tabs button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav.tabs button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll("section.tab").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById("tab-" + b.dataset.tab).classList.add("active");
    if (b.dataset.tab === "topics") setTimeout(renderChart, 50);
    syncHashFromUI();
  };
});

// ============ URL hash sync (shareable links) ============
// Each entry maps a filter element to a short hash key. Only non-default
// values are written into the hash so URLs stay readable.
const HASH_FIELDS = [
  // [elementId, hashKey, kind, defaultValue]
  ["art-search",        "q",         "text",     ""],
  ["art-year",          "year",      "select",   ""],
  ["art-bucket",        "domain",    "select",   ""],
  ["art-author",        "author",    "select",   ""],
  ["art-type",          "type",      "select",   ""],
  ["aut-search",        "autq",      "text",     ""],
  ["aut-profession",    "autprof",   "select",   ""],
  ["aut-domain",        "autdomain", "select",   ""],
  ["aut-articles-only", "autart",    "checkbox", true],
  ["pol-affiliation",   "polaff",    "select",   ""],
  ["pol-domain",        "poldomain", "select",   ""],
  ["pol-agency",        "polagency", "select",   ""],
  ["pol-status",        "polstatus", "select",   ""],
  ["pol-lever",         "pollever",  "select",   ""],
  ["pol-inferred-only", "polinf",    "checkbox", true],
  ["chart-articles-only","chartart", "checkbox", true],
];

function readEl(id, kind) {
  const el = document.getElementById(id);
  if (!el) return null;
  return kind === "checkbox" ? el.checked : el.value;
}
function writeEl(id, kind, val) {
  const el = document.getElementById(id);
  if (!el) return;
  if (kind === "checkbox") el.checked = (val === true || val === "1" || val === "true");
  else el.value = val;
}

function syncHashFromUI() {
  const params = new URLSearchParams();
  const activeTab = document.querySelector("nav.tabs button.active");
  if (activeTab && activeTab.dataset.tab !== "articles") params.set("tab", activeTab.dataset.tab);
  HASH_FIELDS.forEach(([id, key, kind, dflt]) => {
    const v = readEl(id, kind);
    if (v === null || v === undefined) return;
    if (kind === "checkbox") {
      if (v !== dflt) params.set(key, v ? "1" : "0");
    } else {
      if (v !== dflt) params.set(key, v);
    }
  });
  const chartMode = document.querySelector("input[name='chart-mode']:checked");
  if (chartMode && chartMode.value !== "counts") params.set("chartmode", chartMode.value);
  const qs = params.toString();
  const newHash = qs ? "#" + qs : "";
  if (newHash !== window.location.hash) {
    history.replaceState(null, "", newHash || window.location.pathname);
  }
}

function applyHashToUI() {
  const raw = window.location.hash.replace(/^#/, "");
  if (!raw) return;
  const params = new URLSearchParams(raw);
  HASH_FIELDS.forEach(([id, key, kind]) => {
    if (params.has(key)) writeEl(id, kind, params.get(key));
  });
  if (params.has("chartmode")) {
    const r = document.querySelector(`input[name='chart-mode'][value='${params.get("chartmode")}']`);
    if (r) r.checked = true;
  }
  if (params.has("tab")) {
    const btn = document.querySelector(`nav.tabs button[data-tab="${params.get("tab")}"]`);
    if (btn) btn.click();
  }
}
function renderArticlesAndSync() { renderArticles(); syncHashFromUI(); }
function renderAuthorsAndSync() { renderAuthors(); syncHashFromUI(); }
function renderPolicyAndSync() { renderPolicy(); syncHashFromUI(); }
function renderChartAndSync() { renderChart(); syncHashFromUI(); }
document.querySelectorAll("input[name='chart-mode']").forEach(r => r.onchange = renderChartAndSync);
document.getElementById("chart-articles-only").onchange = renderChartAndSync;
document.getElementById("art-search").oninput = renderArticlesAndSync;
["art-year","art-bucket","art-author","art-type"].forEach(id => document.getElementById(id).onchange = renderArticlesAndSync);
document.querySelectorAll("#art-table th").forEach(th => th.onclick = () => {
  const k = th.dataset.sort;
  if (k === SORT_KEY) SORT_DIR *= -1; else { SORT_KEY = k; SORT_DIR = -1; }
  document.querySelectorAll("#art-table th").forEach(x => {
    x.classList.toggle("active", x.dataset.sort === SORT_KEY);
    x.classList.toggle("asc", SORT_DIR === 1);
  });
  renderArticles();
});
// Indicate default sort on load
document.querySelector('#art-table th[data-sort="published_at"]').classList.add("active");
document.getElementById("aut-search").oninput = renderAuthorsAndSync;
["aut-profession","aut-articles-only","aut-domain"].forEach(id => document.getElementById(id).onchange = renderAuthorsAndSync);
document.querySelectorAll(".author-header .sort-h").forEach(el => {
  el.onclick = () => {
    const k = el.dataset.sort;
    if (k === AUTHOR_SORT.key) AUTHOR_SORT.dir *= -1;
    else { AUTHOR_SORT.key = k; AUTHOR_SORT.dir = 1; }
    renderAuthors();
  };
});
["pol-affiliation","pol-domain","pol-agency","pol-status","pol-lever","pol-inferred-only"].forEach(id => document.getElementById(id).onchange = renderPolicyAndSync);
document.querySelectorAll("#pol-table th").forEach(th => th.onclick = () => {
  const k = th.dataset.sort;
  if (k === POL_SORT.key) POL_SORT.dir *= -1;
  else { POL_SORT.key = k; POL_SORT.dir = (k === "score" ? -1 : 1); }
  renderPolicy();
});
document.body.addEventListener("click", e => {
  if (e.target.tagName === "A") return;
  const tr = e.target.closest("tbody tr");
  if (tr && tr.dataset.slug) { openDetail(tr.dataset.slug); return; }
  const ac = e.target.closest(".author-card");
  if (ac && ac.dataset.author) openAuthorDetail(ac.dataset.author);
});
document.getElementById("detail-overlay").addEventListener("click", e => {
  if (e.target.id === "detail-overlay") closeDetail();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

loadData().catch(e => {
  document.body.innerHTML = `<div style="padding:40px;font-family:monospace;">Couldn't load data: ${e}<br><br>Run <code>python update.py</code> first, then serve this folder with <code>python -m http.server</code>.</div>`;
});
</script>
